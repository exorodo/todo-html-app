<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f5f5;
  --text: #1a1a1a;
  --accent: #2563eb;
  --border: #e0e0e0;
  --radius: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.app {
  max-width: 600px;
  margin: 40px auto;
  padding: 0 20px;
}

h1 {
  text-align: center;
  color: var(--accent);
  margin-bottom: 24px;
}

#todo-list {
  list-style: none;
}
</style>
</head>
<body>
<div class="app">
  <h1>Todo App</h1>
  <div id="input-area"></div>
  <ul id="todo-list"></ul>
  <div id="filters"></div>
</div>
<script>
</script>
</body>
</html>
