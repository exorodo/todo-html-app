<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f5f5;
  --text: #1a1a1a;
  --accent: #2563eb;
  --border: #e0e0e0;
  --radius: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.app {
  max-width: 600px;
  margin: 40px auto;
  padding: 0 20px;
}

h1 {
  text-align: center;
  color: var(--accent);
  margin-bottom: 24px;
}

#input-area {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

#todo-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  background: #fff;
}

#todo-input:focus {
  outline: none;
  border-color: var(--accent);
}

#add-btn {
  padding: 10px 20px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 15px;
  cursor: pointer;
  font-family: inherit;
}

#add-btn:hover {
  opacity: 0.9;
}

#todo-list {
  list-style: none;
}

#todo-list li {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: #fff;
  cursor: pointer;
  transition: opacity 0.2s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.delete-btn {
  background: transparent;
  border: none;
  color: #aaa;
  cursor: pointer;
  font-size: 16px;
  padding: 2px 6px;
}

.delete-btn:hover {
  color: #dc2626;
}

#todo-list li.completed {
  text-decoration: line-through;
  opacity: 0.5;
}

#filters {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.filter-btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
}

.filter-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
</style>
</head>
<body>
<div class="app">
  <h1>Todo App</h1>
  <div id="input-area">
    <input type="text" id="todo-input" placeholder="What needs to be done?">
    <button id="add-btn">Add</button>
  </div>
  <ul id="todo-list"></ul>
  <div id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>
</div>
<script>
function saveTodos() { localStorage.setItem('todos', JSON.stringify(todos)); }
function loadTodos() { return JSON.parse(localStorage.getItem('todos')) || []; }

let todos = loadTodos();
let filter = 'all';

function addTodo() {
  const input = document.getElementById('todo-input');
  const text = input.value.trim();
  if (!text) return;
  todos.push({ id: Date.now(), text, completed: false });
  renderTodos();
  input.value = '';
  input.focus();
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === f);
  });
  renderTodos();
}

function renderTodos() {
  const list = document.getElementById('todo-list');
  list.innerHTML = '';
  const filtered = filter === 'all' ? todos : todos.filter(t => filter === 'active' ? !t.completed : t.completed);
  filtered.forEach(todo => {
    const li = document.createElement('li');
    if (todo.completed) li.className = 'completed';
    const span = document.createElement('span');
    span.textContent = todo.text;
    li.appendChild(span);
    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.textContent = 'x';
    del.addEventListener('click', e => { e.stopPropagation(); deleteTodo(todo.id); });
    li.appendChild(del);
    li.addEventListener('click', () => { todo.completed = !todo.completed; renderTodos(); });
    list.appendChild(li);
  });
  saveTodos();
}

function deleteTodo(id) {
  todos = todos.filter(t => t.id !== id);
  renderTodos();
}

document.getElementById('todo-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTodo();
});
document.getElementById('add-btn').addEventListener('click', addTodo);
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => setFilter(btn.dataset.filter));
});
renderTodos();
</script>
</body>
</html>
